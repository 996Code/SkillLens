<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #f7f8fa; --card: #fff; --text: #1a2233; --muted: #6b7280;
        --line: #e5e7eb; --accent: #2563eb; --accent-hover: #1d4ed8;
        --ok: #16a34a; --danger: #dc2626; --radius: 12px;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 400px; height: 520px; overflow: hidden;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--text); background: var(--bg); padding: 12px;
        display: flex; flex-direction: column;
      }
      .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .head .logo {
        width: 22px; height: 22px; border-radius: 6px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-weight: 700; font-size: 11px;
      }
      .head .title { font-weight: 600; }
      .head .sys { margin-left: auto; font-size: 11px; color: var(--muted); }
      .head .sys.ok { color: var(--ok); font-weight: 600; }
      .section {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 10px;
      }
      .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
      input#search {
        width: 100%; padding: 7px 10px; font: inherit; font-size: 12px;
        border: 1px solid var(--line); border-radius: 8px; outline: none;
      }
      input#search:focus { border-color: var(--accent); }
      #skill-list { flex: 1; overflow-y: auto; margin-top: 8px; min-height: 0; }
      .skill-row {
        display: flex; align-items: center; gap: 6px; padding: 5px 2px;
        border-bottom: 1px solid var(--line); cursor: pointer;
      }
      .skill-row:hover { background: #f0f6ff; }
      .skill-row .nm { flex: 1; font-size: 12px; }
      .skill-row .wc { font-size: 10px; color: var(--danger); }
      .skill-row.picked { background: #e8f0fe; }
      .skill-row .ord { font-size: 10px; color: var(--accent); font-weight: 700; width: 14px; }
      #picked-bar {
        display: none; padding: 8px 10px; margin-top: 8px;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 8px; font-size: 12px;
      }
      #picked-bar .steps { color: var(--muted); margin-bottom: 6px; max-height: 60px; overflow-y: auto; }
      #picked-bar .row { display: flex; gap: 6px; }
      #picked-bar input#chain-name {
        flex: 1; padding: 5px 8px; font: inherit; font-size: 12px;
        border: 1px solid var(--line); border-radius: 6px; outline: none;
      }
      button {
        padding: 6px 12px; font: inherit; font-weight: 500; font-size: 12px;
        border: none; border-radius: 6px; cursor: pointer;
      }
      #run-now { background: var(--accent); color: #fff; }
      #run-now:hover { background: var(--accent-hover); }
      #save-chain { background: #eef2f7; color: var(--text); }
      #save-chain:hover { background: #e2e8f0; }
      #saved-chains { margin-top: 8px; max-height: 110px; overflow-y: auto; }
      .chain-row {
        display: flex; align-items: center; gap: 6px; padding: 4px 2px;
        border-bottom: 1px solid var(--line); font-size: 12px;
      }
      .chain-row .nm { flex: 1; }
      .chain-row .meta { font-size: 10px; color: var(--muted); }
      .chain-row button { padding: 2px 8px; font-size: 11px; }
      .chain-row .del { color: var(--danger); background: none; }
      .muted { color: var(--muted); font-size: 12px; padding: 6px 2px; }
      .error { color: var(--danger); font-size: 12px; padding: 6px 2px; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="logo">SL</div>
      <div class="title">空间</div>
      <div class="sys" id="sys">识别系统中…</div>
    </div>

    <div class="section" style="flex:1; display:flex; flex-direction:column; min-height:0">
      <div class="label">当前系统的回放（点选组链，按点击顺序排列）</div>
      <input id="search" placeholder="搜索技能名…" />
      <div id="skill-list"><div class="muted">加载中…</div></div>

      <div id="picked-bar">
        <div class="steps" id="picked-steps"></div>
        <input id="chain-name" placeholder="链名称（如：建表单+发数据）" />
        <div class="row" style="margin-top:6px">
          <button id="run-now">立即执行</button>
          <button id="save-chain">保存为链</button>
        </div>
      </div>

      <div class="label" style="margin-top:8px">已保存的链</div>
      <div id="saved-chains"><div class="muted">无</div></div>
    </div>

    <script type="module" src="src/space.ts"></script>
  </body>
</html>
