# AF1：Dolibarr 适配清单（从 scripts/s43_doli_order.py + s43_doli_replay.py 机械提取）
id: dolibarr
label: Dolibarr 订单
system_label: Dolibarr 订单   # 系统名唯一事实源（HOST_SYSTEM/SYSTEM_ADAPTER 生成）
target:
  base_url: http://127.0.0.1:8080
credentials:
  username: admin
  password_literal: doli-admin-local  # 本地演示容器（lint 警告属预期）
login:
  steps:
    - goto: /
    - fill: ["input[name=username]", "${username}"]
    - fill: ["input[name=password]", "${password}"]
    - click: "input[type=submit], button[type=submit]"
  post_login: []
  # 经典表单系统：登录页在根路径、URL 无 login 字样——URL 探针失效，
  # 登录态唯一证据是登录后首页特征文本（实证 2026-10-09：无此配置时
  # 登录步从不执行、假成功返回 True）
  success: {text_contains: "My Dashboard"}
probes:
  - id: order_count
    kind: docker-exec
    container: dolibarr-db-1
    shell: 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM llx_commande WHERE ref LIKE \"SL-%\""'
chains:
  - name: order-chain
    rounds: 2
    skills: [CreatePartner, CreateOrder, OrderValidate, OrderInvoice]
url_matches: ["http://127.0.0.1:8080/*"]   # P2.5 油猴式接管声明：URL 命中即配对本系统


# P1 交互画像（平台化组件化——通用 Web 型）
interaction_profile:
  dropdown:
    engine: generic
    menu_item_match: includes
    menu_item_click: trusted
    mount_wait_ms: 300
  modal_submit:
    selector: .modal, .o_modal, [role=dialog]
    button_regex: '保存|确定|Save|Confirm|OK'
    pick: first_visible
    render_wait_ms: 600
  form_fill:
    framework: generic
    field_locators: [placeholder, name-attr, form-item-label]
    same_label_priority: first
  row_action:
    anchor_match: sensitive
    scroll_into_view: true
  route_guard:
    async_set_route: false
    normalize_new_suffix: false

flows:
  - name: product-chain
    steps:
      - goto: /product/card.php?action=create
      - fill: ["input[name=ref]", "SLPROD${data}"]
      - fill: ["input[name=label]", "SL产品${data}"]
      - click: "button:has-text(\"Create\")"
