# AF1：ERPNext 适配清单（从 scripts/s43_erpnext_crm.py + s43_erpnext_replay.py 机械提取）
id: erpnext
label: ERPNext CRM
system_label: ERPNext 客户   # 系统名唯一事实源（HOST_SYSTEM/SYSTEM_ADAPTER 生成）
target:
  base_url: http://127.0.0.1:8090
credentials:
  username: Administrator
  password_literal: admin   # 本地演示容器（lint 警告属预期）
login:
  steps:
    - goto: /login
    - fill: ["#login_email", "${username}"]
    - fill: ["#login_password", "${password}"]
    - click: "button:has-text(\"Continue\")"
  post_login: []
  # v15 新 desk：登录页 DOM 已变（#login_email/Continue——旧
  # data-fieldname 选择器 fill 超时且 URL 判定假成功，2026-10-09 实证）。
  # text_contains 双通道防假成功：登录成功后 desk 首页有 "My Shortcuts"
  # 预检假成功实证（2026-10-09）：根路径 / 对未登录返回 200 SPA 壳
  # （JS 异步跳 login，2500ms 内未跳）——URL 探针单通道必假成功。
  # 双通道：URL 不含 /login 且 desk 首页特征文本（Desktop）可见
  success: {url_not_contains: "/login", text_contains: "Desktop"}
probes:
  - id: quotation_count
    kind: docker-exec
    container: erpnext-backend-1
    shell: 'cd /home/frappe/frappe-bench && bench --site frontend execute frappe.client.get_list --kwargs "{\"doctype\":\"Quotation\",\"filters\":[[\"docstatus\",\"=\",1]],\"limit_page_length\":0,\"fields\":[\"name\"]}"'
    parse_regex: '"name": "(.+?)"'
chains:
  - name: crm-chain
    rounds: 2
    skills: [CustomerCreate, QuotationCreate, SalesOrderCreate]
url_matches: ["http://127.0.0.1:8090/*"]   # P2.5 油猴式接管声明：URL 命中即配对本系统


# P1 交互画像（平台化组件化）
interaction_profile:
  dropdown:
    engine: generic
    menu_item_match: includes
    menu_item_click: trusted
    mount_wait_ms: 300
  modal_submit:
    selector: .modal-content, [role=dialog]
    button_regex: 'Save|Submit|Yes'
    pick: first_visible
    render_wait_ms: 600
  form_fill:
    framework: frappe                  # cur_frm.set_value/model.set_value 通道
    field_locators: [data-fieldname, placeholder, name-attr]
    same_label_priority: modal_first
  row_action:
    anchor_match: sensitive
    scroll_into_view: true
  route_guard:
    async_set_route: true              # SPA 异步跳变防护（236 铁证）
    normalize_new_suffix: true         # /new-xxx 随机后缀归一

flows:
  - name: supplier-chain
    steps:
      - goto: /app/supplier/new
      - fill: ["[data-fieldname=supplier_name] input", "SL供应商${data}"]
      - click: "button[data-label=Save]"
