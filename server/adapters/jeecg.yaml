# AF1：JeecgBoot 适配清单（从 scripts/s43_jeecg_form.py + s43_jeecg_replay2.py 机械提取）
id: jeecg
label: JeecgBoot 在线表单
target:
  base_url: http://127.0.0.1:8095
credentials:
  username: admin
  password_literal: "123456"  # 本地演示容器（lint 警告属预期）
login:
  steps:
    - goto: /
    - fill: ["input[placeholder*='账号']", "${username}"]
    - fill: ["input[placeholder*='密码']", "${password}"]
    - click: "button:has-text(\"登\")"
  post_login: []
probes:
  - id: form_count
    kind: docker-exec
    container: jeecg-boot-mysql
    # SQL 避开反引号（sh -c 会把 `db` 当命令替换）——information_schema 查询
    shell: 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"jeecg-boot\" AND table_name LIKE \"sl_%\""'
  - id: fill_row_count
    kind: docker-exec
    container: jeecg-boot-mysql
    shell: 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"jeecg-boot\" AND table_name LIKE \"sl_%\""'
chains:
  - name: form-chain
    rounds: 2
    # skill 引用支持 id:（S43-4 验证过的技能——LLM 命名不稳定，id 直引最稳）
    skills: ["269", "270", "271"]
    replay:
      - skill: "269"
        overrides: {"*表名": "sl_rp${ts}", "*表描述": "SL回放表单${ts}"}
        verify: {probe: form_count, expect: increased}
      - skill: "270"
        overrides: {"*表名": "sl_rp${ts}", "*表描述": "SL回放表单${ts}"}
      - skill: "271"
        overrides: {"*表名": "sl_rp${ts}", "*表描述": "SL回放表单${ts}"}
url_matches: ["http://127.0.0.1:8095/*"]   # P2.5 油猴式接管声明：URL 命中即配对本系统


# P1 交互画像（平台化组件化——executor 特化分支的声明式载体）
interaction_profile:
  dropdown:
    engine: ant-design
    menu_item_match: includes          # 图标文本混入——精确===不中（270 铁证）
    menu_item_click: trusted           # React onClick 走 mousedown 委托
    mount_wait_ms: 400
  modal_submit:
    selector: .ant-modal-content, .ant-drawer-content
    button_regex: '保存|确定|提\s*交|同步'
    pick: last_visible                 # footer 多同名隐藏副本（JeecG 实证）
    render_wait_ms: 800
  form_fill:
    framework: generic
    field_locators: [placeholder, form-item-label, name-attr]
    same_label_priority: modal_first   # 查询栏与 modal 同 label（269 铁证）
  row_action:
    anchor_match: insensitive          # 表名 lowercase 存储（270 铁证）
    scroll_into_view: true
  route_guard:
    async_set_route: false
    normalize_new_suffix: false
