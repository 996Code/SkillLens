# AF1：Odoo 适配清单（从 scripts/s43_odoo_sales.py + s43_odoo_replay.py 机械提取）
id: odoo
label: Odoo 18 销售
system_label: Odoo 销售   # 系统名唯一事实源（HOST_SYSTEM/SYSTEM_ADAPTER 生成）
target:
  base_url: http://127.0.0.1:8069
credentials:
  username: admin@local.test
  password_literal: "SlOd2026!local"  # 本地演示容器（2026-10-03 经 odoo shell 重置，lint 属预期）
login:
  steps:
    - goto: /web/login
    - fill: ["input[name=login]", "${username}"]
    - fill: ["input[name=password]", "${password}"]
    - click: "button[type=submit]"
  post_login: []
probes:
  - id: sale_order_count
    kind: docker-exec
    container: odoo-odoo-1
    shell: 'python3 -c "import xmlrpc.client,os;u=xmlrpc.client.ServerProxy(\"http://127.0.0.1:8069/xmlrpc/2/common\");uid=u.authenticate(\"skilllens-demo\",\"admin@local.test\",os.environ.get(\"ODOO_PW\",\"\"),{});m=xmlrpc.client.ServerProxy(\"http://127.0.0.1:8069/xmlrpc/2/object\");print(m.execute_kw(\"skilllens-demo\",uid,os.environ.get(\"ODOO_PW\",\"\"),\"sale.order\",\"search_count\",[[(\"name\",\"like\",\"SL\")]]))"'
chains:
  - name: sales-chain
    rounds: 2
    skills: [SaleQuoteCreate, SaleOrderConfirm, SaleInvoiceCreate]
url_matches: ["http://127.0.0.1:8069/*"]   # P2.5 油猴式接管声明：URL 命中即配对本系统


# P1 交互画像（平台化组件化——通用 Web 型）
interaction_profile:
  dropdown:
    engine: generic
    menu_item_match: includes
    menu_item_click: trusted
    mount_wait_ms: 300
  modal_submit:
    selector: .modal, .o_modal, [role=dialog]
    button_regex: '保存|确定|Save|Confirm|OK'
    pick: first_visible
    render_wait_ms: 600
  form_fill:
    framework: generic
    field_locators: [placeholder, name-attr, form-item-label]
    same_label_priority: first
  row_action:
    anchor_match: sensitive
    scroll_into_view: true
  route_guard:
    async_set_route: false
    normalize_new_suffix: false

flows:
  - name: crm-lead-chain
    steps:
      - goto: /odoo/crm/new
      - fill: ["input[name=name]", "SL线索${data}"]
      - click: "button:has-text(\"Save\")"
