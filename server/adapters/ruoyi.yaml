# AF1：若依适配清单（从 scripts/s43_ruoyi_perm.py + s43_ruoyi_replay.py 机械提取）
id: ruoyi
label: 若依 RuoYi-Vue3
system_label: 若依权限   # 系统名唯一事实源（HOST_SYSTEM/SYSTEM_ADAPTER 生成）
target:
  base_url: http://127.0.0.1:8093
credentials:
  username: admin
  password_literal: admin123   # 本地演示容器（lint 警告属预期）
login:
  steps:
    - goto: /
    - fill: ["[placeholder=账号]", "${username}"]
    - fill: ["[placeholder=密码]", "${password}"]
    - click: "button:has-text(\"登\")"
  post_login: [confirm_el_box]
  success:
    url_not_contains: login
    text_contains: 首页
probes:
  - id: role_count
    kind: docker-exec
    container: ruoyi-mysql
    shell: 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM `ry-vue`.sys_role WHERE role_key LIKE \"sl_%\""'
  - id: user_count
    kind: docker-exec
    container: ruoyi-mysql
    shell: 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM `ry-vue`.sys_user WHERE user_name LIKE \"sluser%\""'
  - id: login_ok
    kind: http
    request:
      method: POST
      url: "${base_url}/prod-api/login"
      json: {username: "${new_user}", password: "${new_pass}"}
    assert: {status: 200, contains: token}
chains:
  - name: perm-chain
    rounds: 2
    skills: [RuoYiRoleCreate, RuoYiUserCreate, RuoYiLoginVerify]
    replay:
      - skill: RuoYiRoleCreate
        overrides: {"请输入角色名称": "SL回放${ts}", "请输入权限字符": "sl_replay_${ts}"}
        verify: {probe: role_count, expect: increased}
url_matches: ["http://127.0.0.1:8093/*"]   # P2.5 油猴式接管声明：URL 命中即配对本系统


# P1 交互画像（平台化组件化）
interaction_profile:
  dropdown:
    engine: element-plus               # el-dropdown trigger:hover 流入点击
    menu_item_match: includes
    menu_item_click: trusted
    mount_wait_ms: 500
  modal_submit:
    selector: .el-message-box, .ant-modal-content
    button_regex: '确\s*定|保存|提\s*交'
    pick: first_visible
    render_wait_ms: 600
  form_fill:
    framework: generic
    field_locators: [placeholder, form-item-label, name-attr]
    same_label_priority: modal_first
  row_action:
    anchor_match: sensitive
    scroll_into_view: true
  route_guard:
    async_set_route: false
    normalize_new_suffix: false

flows:
  - name: dept-chain
    steps:
      - goto: /system/dept
      - click: "button:has-text(\"新增\")"
      - fill: ["input[placeholder=请输入部门名称]", "SL部门${data}"]
      - click: ".el-dialog .el-button--primary"
