# AF1：Snipe-IT 适配清单（从 scripts/s43_snipe_flow.py + s43_snipe_replay.py 机械提取）
id: snipe
label: Snipe-IT 资产管理
target:
  base_url: http://127.0.0.1:8081
credentials:
  username: admin
  password_literal: "Snipe@618local"  # 本地演示容器（lint 警告属预期）
login:
  steps:
    - goto: /
    - fill: ["input[name=username]", "${username}"]
    - fill: ["input[name=password]", "${password}"]
    - click: "button[type=submit]"
  post_login: []
probes:
  - id: asset_count
    kind: docker-exec
    container: snipeit-db-1
    shell: 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM snipeit.assets WHERE name LIKE \"SL-%\""'
chains:
  - name: asset-chain
    rounds: 2
    skills: [AssetCreate, AssetCheckout, AssetCheckin]
url_matches: ["http://127.0.0.1:8081/*"]   # P2.5 油猴式接管声明：URL 命中即配对本系统


# P1 交互画像（平台化组件化——通用 Web 型）
interaction_profile:
  dropdown:
    engine: generic
    menu_item_match: includes
    menu_item_click: trusted
    mount_wait_ms: 300
  modal_submit:
    selector: .modal, .o_modal, [role=dialog]
    button_regex: '保存|确定|Save|Confirm|OK'
    pick: first_visible
    render_wait_ms: 600
  form_fill:
    framework: generic
    field_locators: [placeholder, name-attr, form-item-label]
    same_label_priority: first
  row_action:
    anchor_match: sensitive
    scroll_into_view: true
  route_guard:
    async_set_route: false
    normalize_new_suffix: false
