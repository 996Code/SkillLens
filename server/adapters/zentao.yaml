# AF1：禅道适配清单（从 scripts/s43_zentao_qa.py + s43_zentao_qa_replay.py 机械提取）
id: zentao
label: 禅道 22
system_label: 禅道项目   # 系统名唯一事实源（HOST_SYSTEM/SYSTEM_ADAPTER 生成）
target:
  base_url: http://127.0.0.1:8082
credentials:
  username: admin
  password_literal: "SlZt2026!local"  # 本地演示容器（2026-10-03 经 DB 重置，lint 属预期）
login:
  steps:
    - goto: /index.php?m=user&f=login
    - fill: ["#account", "${username}"]
    - fill: ["input[name=password]", "${password}"]
    - click: "button[type=submit], #submit"
  post_login: [close_guide]
probes:
  # 禅道容器 root 密码不在 env（官方镜像存应用配置）——复杂 shell 放
  # 独立脚本（adapters/scripts/zentao_db.sh，内含从 my.php 抽密码逻辑，
  # 密码不落清单/日志——安全红线）；manifest 只引用脚本+传 SQL
  - id: story_count
    kind: docker-exec
    container: zentao
    shell: 'sh /opt/skilllens/zentao_db.sh "SELECT COUNT(*) FROM zentao.zt_story WHERE title LIKE \"SL%\""'
chains:
  - name: qa-chain
    rounds: 2
    skills: [ZentaoStoryCreate, ZentaoCaseCreate, ZentaoTesttaskCreate, ZentaoCaseRun]
    replay:
      - skill: ZentaoStoryCreate
        overrides: {"*标题": "SL回放${ts}"}
        verify: {probe: story_count, expect: increased}
flows:
  # AF4：走查录制（s43_zentao_qa 四流机械提取；iframe/routine 收编例程库）
  - name: ZentaoStoryCreate
    steps:
      - goto: /index.php?m=story&f=create&productID=1
      - routine: close_guide
      - fill: ["input[name='title']", "${data}"]
      - routine: biz_frame_submit
  - name: ZentaoCaseCreate
    steps:
      - goto: /index.php?m=testcase&f=create&productID=1
      - routine: close_guide
      - fill: ["input[name='title']", "${data}"]
      - routine: biz_frame_submit
  - name: ZentaoTesttaskCreate
    steps:
      - goto: /index.php?m=testtask&f=create&productID=1
      - routine: close_guide
      - fill: ["input[name='name']", "${data}"]
      - routine: biz_frame_submit
  - name: ZentaoCaseRun
    steps:
      - goto: /index.php?m=testcase&f=browse&productID=1
      - routine: close_guide
      - click: "a[title=执行]"
      - wait: "3500"
      - routine: biz_frame_submit
      - wait: "1500"
  - name: bug-chain
    steps:
      - goto: /index.php?m=bug&f=create&productID=1
      - fill: ["#title", "SL缺陷${data}"]
      - click: "#submitbutton"
url_matches: ["http://127.0.0.1:8082/*"]   # P2.5 油猴式接管声明：URL 命中即配对本系统


# P1 交互画像（平台化组件化）
interaction_profile:
  dropdown:
    engine: generic
    menu_item_match: exact
    menu_item_click: trusted
    mount_wait_ms: 300
  modal_submit:
    selector: .modal, [role=dialog]
    button_regex: '保存|确定|提\s*交'
    pick: first_visible
    render_wait_ms: 600
  form_fill:
    framework: generic
    field_locators: [name-attr, placeholder, form-item-label]  # zentao 裸表单 name 优先
    same_label_priority: first
  row_action:
    anchor_match: sensitive
    scroll_into_view: true
  route_guard:
    async_set_route: false
    normalize_new_suffix: false
