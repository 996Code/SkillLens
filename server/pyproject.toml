[project]
name = "skilllens-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "langgraph>=1.2.11",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# scripts/ 是运维脚本（含模块级 asyncio.run 真机流程）——匹配 *_test.py
# 默认模式会被收集即执行，测试套件不得依赖活环境（lessons #44 同族）
testpaths = ["tests"]
